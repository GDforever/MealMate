spring:
  application:
    name: MealMate
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mealmate}
    username: ${DB_USERNAME:mealmate}
    password: ${DB_PASSWORD:your-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_API_KEY:your-api-key}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7

server:
  port: 8456

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-at-least-256-bits-long-for-hs256-please-change-in-production}
  expiration: 604800000  # 7 days in milliseconds

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.gd.mealmate: DEBUG
    org.springframework.security: DEBUG

# Amap (高德地图) Configuration
amap:
  api-key: ${AMAP_API_KEY:your-amap-key}
  base-url: https://restapi.amap.com/v3
  sync:
    enabled: true
    cron: "0 0 2 * * ?"
    center:
      latitude: 39.9042
      longitude: 116.4074
    radius: 5000

# Chat Configuration
chat:
  history:
    max-messages: 50
  title:
    max-length: 20

# Knowledge Base Configuration
app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  knowledge:
    chunk-size: 100
    chunk-overlap: 50
    top-k: 5
    similarity-threshold: 0.7
    embedding-dimension: 1024
