spring:
  application:
    name: MealMate
  datasource:
    url: jdbc:h2:mem:mealmate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ***REMOVED***
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-at-least-256-bits-long-for-hs256-please-change-in-production}
  expiration: 604800000  # 7 days in milliseconds

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    com.gd.mealmate: DEBUG
    org.springframework.security: DEBUG

# Amap (高德地图) Configuration
amap:
  api-key: ***REMOVED***
  base-url: https://restapi.amap.com/v3
  sync:
    enabled: true
    cron: "0 0 2 * * ?"
    center:
      latitude: 39.9042
      longitude: 116.4074
    radius: 5000

# Chat Configuration
chat:
  history:
    max-messages: 50
  title:
    max-length: 20
